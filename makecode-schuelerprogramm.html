<title>Teachable Labor – Schülerprogramm in MakeCode</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef3fb;color:#18233b}
body{display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:.8rem;padding:.65rem max(.8rem,env(safe-area-inset-right)) .65rem max(.8rem,env(safe-area-inset-left));background:#fff;border-bottom:1px solid #dfe6f1;box-shadow:0 1px 8px #10204014;z-index:2}
#brand{font-weight:800;white-space:nowrap}
#status{font-size:.9rem;color:#55627a;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#error{display:none;position:fixed;inset:auto 1rem max(1rem,env(safe-area-inset-bottom)) 1rem;background:#fff3cd;border:1px solid #e7c65a;border-radius:14px;padding:1rem;z-index:5;box-shadow:0 8px 30px #0002}

@media(max-width:700px){#top{gap:.55rem}#brand{font-size:.9rem}#status{font-size:.78rem}#fallback{font-size:.78rem}}
</style>
</head>
<body>
<div id="top">
  <div id="brand">Teachable Labor</div>
  <div id="status">MakeCode wird geladen …</div>
  <a id="fallback" href="Kameralabor-Schuelerprogramm-v3.mkcd" download="Kameralabor-Schuelerprogramm-v3.mkcd">.mkcd laden</a>
</div>
<iframe id="editor" title="Microsoft MakeCode für micro:bit" src="https://makecode.microbit.org/?controller=1&light=1" allow="camera; microphone; clipboard-read; clipboard-write; usb; bluetooth"></iframe>
<div id="error"><strong>Automatisches Öffnen hat nicht geklappt.</strong><span>Nutze als sicheren Ersatz die <a href="Kameralabor-Schuelerprogramm-v3.mkcd" download="Kameralabor-Schuelerprogramm-v3.mkcd">Schülerprogramm-Datei</a> und importiere sie in MakeCode.</span></div>
<script>
(function(){
  "use strict";
  const INITIAL={"text":{"pxt.json":"{\n    \"name\": \"Teachable Labor Schuelerprogramm\",\n    \"description\": \"Aendere nur die Aktionen in den zehn Zahl-Ereignissen. USB und Bluetooth sind in der Teachable-Labor-Erweiterung verborgen.\",\n    \"dependencies\": {\n        \"core\": \"*\",\n        \"bluetooth\": \"*\"\n    },\n    \"files\": [\n        \"main.blocks\",\n        \"main.ts\",\n        \"teachable-labor.ts\",\n        \"README.md\"\n    ],\n    \"supportedTargets\": [\n        \"microbit\"\n    ],\n    \"preferredEditor\": \"blocksprj\",\n    \"yotta\": {\n        \"config\": {\n            \"microbit-dal\": {\n                \"bluetooth\": {\n                    \"open\": 0,\n                    \"whitelist\": 1,\n                    \"security_level\": \"SECURITY_MODE_ENCRYPTION_NO_MITM\"\n                }\n            }\n        }\n    }\n}","main.blocks":"\u003cxml xmlns=\"https://developers.google.com/blockly/xml\">\u003cvariables>\u003c/variables>\u003c/xml>","main.ts":"","README.md":"# Teachable Labor – Schülerprogramm\n\nDie Programmierfläche startet leer.\n\nIn der Werkzeugleiste findest du **Teachable Labor** mit:\n- wenn Zahl 1 empfangen\n- ...\n- wenn Zahl 10 empfangen\n\nDie Kommunikationslogik ist direkt in diesem Projekt enthalten. Deshalb kann das Projekt auch dann geöffnet werden, wenn MakeCode die GitHub-Erweiterung gerade nicht nachladen kann.\n\nUSB, Bluetooth-UART, PING/PONG und OK-Antworten laufen im Hintergrund. Teachable-Labor-Aktionen werden nacheinander ausgeführt, damit Töne und Melodien nicht unkontrolliert überlappen.\n","teachable-labor.ts":"/**\n * Teachable Labor\n * Die App sendet die Zahlen 1 bis 10.\n * USB-Serial, Bluetooth-UART, PING/PONG und OK-Bestaetigungen bleiben\n * in dieser Erweiterung verborgen. Im Schuelerprojekt sind nur die\n * zehn Ereignisbloecke sichtbar.\n */\n\n//% color=\"#7B24C9\" block=\"Teachable Labor\" weight=100\nnamespace teachableLabor {\n    const EVENT_SOURCE = 9100\n    let started = false\n    let actionRunning = false\n    let activeNumber = 0\n    let queuedNumber = 0\n\n    function commandNumber(value: string): number {\n        if (value == \"1\") return 1\n        if (value == \"2\") return 2\n        if (value == \"3\") return 3\n        if (value == \"4\") return 4\n        if (value == \"5\") return 5\n        if (value == \"6\") return 6\n        if (value == \"7\") return 7\n        if (value == \"8\") return 8\n        if (value == \"9\") return 9\n        if (value == \"10\") return 10\n        return 0\n    }\n\n    function processCommand(value: string, viaBluetooth: boolean): void {\n        if (value == \"PING\") {\n            if (viaBluetooth) bluetooth.uartWriteLine(\"PONG\")\n            else serial.writeLine(\"PONG\")\n            return\n        }\n\n        const number = commandNumber(value)\n        if (number == 0) return\n\n        const answer = \"OK:\" + value\n        if (viaBluetooth) bluetooth.uartWriteLine(answer)\n        else serial.writeLine(answer)\n\n        control.raiseEvent(EVENT_SOURCE, number)\n    }\n\n    function startCommunication(): void {\n        if (started) return\n        started = true\n\n        serial.redirectToUSB()\n        serial.setBaudRate(115200)\n        bluetooth.startUartService()\n\n        serial.onDataReceived(\"\\n\", function () {\n            processCommand(serial.readUntil(\"\\n\"), false)\n        })\n        bluetooth.onUartDataReceived(\"\\n\", function () {\n            processCommand(bluetooth.uartReadUntil(\"\\n\"), true)\n        })\n    }\n\n    function register(number: number, handler: () => void): void {\n        startCommunication()\n        control.onEvent(EVENT_SOURCE, number, function () {\n            // MakeCode-Ereignisse koennen nebenlaeufig laufen. Lange Aktionen wie\n            // Toene oder Melodien duerfen deshalb nicht mit der naechsten\n            // Erkennung ueberlappen. Waehren eine Aktion laeuft, merken wir uns\n            // nur die zuletzt eingegangene andere Zahl.\n            if (actionRunning) {\n                queuedNumber = number == activeNumber ? 0 : number\n                return\n            }\n\n            actionRunning = true\n            activeNumber = number\n            handler()\n            activeNumber = 0\n            actionRunning = false\n\n            if (queuedNumber != 0) {\n                const next = queuedNumber\n                queuedNumber = 0\n                control.raiseEvent(EVENT_SOURCE, next)\n            }\n        })\n    }\n\n    /**\n     * Startet die Kommunikation. Wird vom Schülerprojekt unsichtbar aufgerufen.\n     */\n    //% blockHidden=true\n    export function start(): void {\n        startCommunication()\n    }\n\n    /**\n     * Fuehrt die eingefuegten Bloecke aus, wenn die App Zahl 1 sendet.\n     */\n    //% blockId=teachable_labor_on_1 block=\"wenn Zahl 1 empfangen\"\n    //% weight=100\n    export function on1(handler: () => void): void {\n        register(1, handler)\n    }\n\n    /**\n     * Fuehrt die eingefuegten Bloecke aus, wenn die App Zahl 2 sendet.\n     */\n    //% blockId=teachable_labor_on_2 block=\"wenn Zahl 2 empfangen\"\n    //% weight=99\n    export function on2(handler: () => void): void {\n        register(2, handler)\n    }\n\n    /**\n     * Fuehrt die eingefuegten Bloecke aus, wenn die App Zahl 3 sendet.\n     */\n    //% blockId=teachable_labor_on_3 block=\"wenn Zahl 3 empfangen\"\n    //% weight=98\n    export function on3(handler: () => void): void {\n        register(3, handler)\n    }\n\n    /**\n     * Fuehrt die eingefuegten Bloecke aus, wenn die App Zahl 4 sendet.\n     */\n    //% blockId=teachable_labor_on_4 block=\"wenn Zahl 4 empfangen\"\n    //% weight=97\n    export function on4(handler: () => void): void {\n        register(4, handler)\n    }\n\n    /**\n     * Fuehrt die eingefuegten Bloecke aus, wenn die App Zahl 5 sendet.\n     */\n    //% blockId=teachable_labor_on_5 block=\"wenn Zahl 5 empfangen\"\n    //% weight=96\n    export function on5(handler: () => void): void {\n        register(5, handler)\n    }\n\n    /**\n     * Fuehrt die eingefuegten Bloecke aus, wenn die App Zahl 6 sendet.\n     */\n    //% blockId=teachable_labor_on_6 block=\"wenn Zahl 6 empfangen\"\n    //% weight=95\n    export function on6(handler: () => void): void {\n        register(6, handler)\n    }\n\n    /**\n     * Fuehrt die eingefuegten Bloecke aus, wenn die App Zahl 7 sendet.\n     */\n    //% blockId=teachable_labor_on_7 block=\"wenn Zahl 7 empfangen\"\n    //% weight=94\n    export function on7(handler: () => void): void {\n        register(7, handler)\n    }\n\n    /**\n     * Fuehrt die eingefuegten Bloecke aus, wenn die App Zahl 8 sendet.\n     */\n    //% blockId=teachable_labor_on_8 block=\"wenn Zahl 8 empfangen\"\n    //% weight=93\n    export function on8(handler: () => void): void {\n        register(8, handler)\n    }\n\n    /**\n     * Fuehrt die eingefuegten Bloecke aus, wenn die App Zahl 9 sendet.\n     */\n    //% blockId=teachable_labor_on_9 block=\"wenn Zahl 9 empfangen\"\n    //% weight=92\n    export function on9(handler: () => void): void {\n        register(9, handler)\n    }\n\n    /**\n     * Fuehrt die eingefuegten Bloecke aus, wenn die App Zahl 10 sendet.\n     */\n    //% blockId=teachable_labor_on_10 block=\"wenn Zahl 10 empfangen\"\n    //% weight=91\n    export function on10(handler: () => void): void {\n        register(10, handler)\n    }\n\n    // Kommunikation startet automatisch, ohne sichtbaren Block im Schülerprojekt.\n    startCommunication()\n}\n"}};
  const frame=document.getElementById("editor");
  const status=document.getElementById("status");
  const errorBox=document.getElementById("error");
  const STORAGE_KEY="teachable-labor-makecode-project-v1";
  let imported=false;
  let importRequested=false;
  let lastProject=null;
  let failTimer=null;

  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved) lastProject=JSON.parse(saved);
  }catch(e){}

  function project(){
    if(lastProject&&lastProject.text)return lastProject;
    return JSON.parse(JSON.stringify(INITIAL));
  }

  function post(msg){
    if(frame.contentWindow) frame.contentWindow.postMessage(msg,"https://makecode.microbit.org");
  }

  function requestImport(){
    if(importRequested)return;
    importRequested=true;
    status.textContent="Schülerprogramm wird in MakeCode geöffnet …";
    post({
      type:"pxteditor",
      id:"teachable-import-"+Date.now(),
      action:"importproject",
      project:project(),
      response:true
    });
    setTimeout(()=>post({type:"pxteditor",id:"teachable-blocks-"+Date.now(),action:"switchblocks"}),900);
  }

  window.addEventListener("message",function(ev){
    if(ev.source!==frame.contentWindow)return;
    if(ev.origin!=="https://makecode.microbit.org")return;
    const msg=ev.data||{};

    if(msg.type==="pxthost"&&msg.action==="workspacesync"){
      msg.projects=[project()];
      post(msg);
      setTimeout(requestImport,50);
      return;
    }

    if(msg.type==="pxthost"&&msg.action==="workspacesave"&&msg.project){
      lastProject=msg.project;
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(msg.project))}catch(e){}
      return;
    }

    if(msg.type==="pxteditor"&&msg.action==="importproject"){
      imported=true;
      status.textContent="Schülerprogramm geöffnet · Teachable Labor ist links in der Werkzeugleiste";
      errorBox.style.display="none";
      if(failTimer)clearTimeout(failTimer);
      setTimeout(()=>post({type:"pxteditor",id:"teachable-blocks2-"+Date.now(),action:"switchblocks"}),150);
    }
  },false);

  frame.addEventListener("load",function(){
    status.textContent="MakeCode bereit · Schülerprogramm wird geladen …";
    setTimeout(requestImport,1200);
  });

  failTimer=setTimeout(function(){
    if(!imported){
      status.textContent="Automatisches Laden nicht bestätigt";
      errorBox.style.display="block";
    }
  },12000);
})();
</script>
</body>
</html>
